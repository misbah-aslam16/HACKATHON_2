name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'todo-app-fullstack/**'
      - '.github/workflows/deploy-frontend-vercel.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'todo-app-fullstack/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  BACKEND_URL: https://hackathon2-production-8e72.up.railway.app

jobs:
  deploy:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd todo-app-fullstack
          
          vercel deploy \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --env NEXT_PUBLIC_BACKEND_URL=${{ env.BACKEND_URL }} \
            --env NEXT_PUBLIC_APP_URL=https://${{ secrets.VERCEL_PROJECT_NAME }}.vercel.app \
            --env DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --env DATABASE_URL_UNPOOLED=${{ secrets.DATABASE_URL_UNPOOLED }} \
            --env AUTH_SECRET=${{ secrets.AUTH_SECRET }} \
            --env BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          cd todo-app-fullstack
          
          vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --env NEXT_PUBLIC_BACKEND_URL=${{ env.BACKEND_URL }} \
            --env NEXT_PUBLIC_APP_URL=https://${{ secrets.VERCEL_PROJECT_NAME }}.vercel.app \
            --env DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --env DATABASE_URL_UNPOOLED=${{ secrets.DATABASE_URL_UNPOOLED }} \
            --env AUTH_SECRET=${{ secrets.AUTH_SECRET }} \
            --env BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Frontend deployed to Vercel!\n\nBackend: https://hackathon2-production-8e72.up.railway.app'
            })

      - name: Create deployment summary
        run: |
          echo "## 🚀 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Deployed to Vercel" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** https://hackathon2-production-8e72.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
